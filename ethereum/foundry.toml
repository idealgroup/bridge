[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
# Intentional lossy casts in LE encoding; style lints on internal variable names.
exclude_lints = ["unsafe-typecast", "mixed-case-variable", "screaming-snake-case-immutable"]
