[package]
name = "e2e"
version = "0.1.0"
edition = "2021"

[dependencies]
bridge = { path = "../bridge" }
committee = { path = "../committee" }
operator = { path = "../operator" }
depositor = { path = "../depositor" }
challenger = { path = "../challenger" }
lamport = { path = "../lamport" }
bitcoin = "0.32"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
alloy = { version = "1.8", features = ["full", "node-bindings", "sol-types", "contract", "providers", "rpc-client", "signers", "signer-local"] }
